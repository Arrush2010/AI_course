<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study To-Do</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Study To-Do</h1><form id="form"><label for="task">New task</label><input id="task" maxlength="160" required><button>Add</button></form>
